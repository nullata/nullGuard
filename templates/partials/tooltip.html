{{define "tooltip"}}
<span class="info-tooltip"><i class="fa-solid fa-circle-info"></i><span class="info-tooltip-text">{{.}}</span></span>
{{end}}

{{define "tooltip-with-cheatsheet"}}
<span class="info-tooltip info-tooltip-clickable" data-cheatsheet="{{.Key}}" data-cheatsheet-title="{{.Title}}"><i class="fa-solid fa-circle-info"></i><span class="info-tooltip-text">{{.Text}} Click to view cheatsheet.</span></span>
{{end}}
