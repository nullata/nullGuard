<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup - NullGuard</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script src="/static/js/theme-init.js"></script>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/fontawesome-free-7.1.0-web/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/jquery/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/global.js"></script>
    <script src="/static/js/setup.js"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="/setup"><img src="/static/images/logo.png" alt="NickScripts" style="height: 30px; margin-bottom: 6px;">&nbsp;nullGuard</a>
                <button id="theme-toggle" class="nav-link bg-transparent border-0 ms-auto"
                    style="color: var(--text-primary);" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </nav>
    </header>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">NullGuard Setup</h2>
                        <p class="text-center text-muted mb-4">Create your admin account to get started</p>

                        <form id="setup-form">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Enter username" required>
                                <small class="form-text text-muted">At least 3 characters, alphanumeric with dots,
                                    dashes, or underscores</small>
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Enter password" required>
                                <small class="form-text text-muted">At least 8 characters with uppercase, lowercase, and
                                    digit</small>
                            </div>

                            <div class="form-group">
                                <label for="password_confirm">Confirm Password</label>
                                <input type="password" class="form-control" id="password_confirm"
                                    name="password_confirm" placeholder="Re-enter password" required>
                            </div>

                            <div class="form-group">
                                <label for="password_hint">Password Hint (Optional)</label>
                                <input type="text" class="form-control" id="password_hint" name="password_hint"
                                    placeholder="Enter a hint to help remember your password">
                                <small class="form-text text-muted">Max 255 characters</small>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-4"><i class="fas fa-user-plus me-2"></i>Create Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "modal"}}
</body>

</html>
