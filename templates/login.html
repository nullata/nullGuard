<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - NullGuard</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script src="/static/js/theme-init.js"></script>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/fontawesome-free-7.1.0-web/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/jquery/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/global.js"></script>
    <script src="/static/js/login.js"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="/login"><img src="/static/images/logo.png" alt="NickScripts" style="height: 30px; margin-bottom: 6px;">&nbsp;nullGuard</a>
                <button id="theme-toggle" class="nav-link bg-transparent border-0 ms-auto"
                    style="color: var(--text-primary);" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </nav>
    </header>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">NullGuard Login</h2>

                        <form id="login-form">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Enter username" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Enter password" required>
                            </div>

                            <div class="form-group">
                                <a href="#" id="show-hint-link" class="small">Show password hint</a>
                            </div>

                            <div id="hint-display" class="alert alert-info" style="display: none;">
                                <strong>Password Hint:</strong> <span id="hint-text"></span>
                            </div>

                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "modal"}}
</body>

</html>
