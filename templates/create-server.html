{{define "content"}}
<script src="/static/js/server.js"></script>
<script src="/static/js/create-server.js"></script>
<div class="container p-4 mb-4 border rounded bg-light">
    <h3><i class="fa-solid fa-server"></i> Server Configuration</h3>
    <hr>

    {{if .IsFirstServer}}
    <p>No servers found. Please configure a new server:</p>
    {{else}}
    <p>Create a new server:</p>
    {{end}}
    <form id="create-server-form">
        <div class="form-group">
            <label for="interfaceName">Interface Name{{template "tooltip" "Name of the WireGuard network interface (e.g. wg0). Must be unique on the host."}}</label>
            <input type="text" class="form-control" id="interfaceName" name="interfaceName"
                value="{{.DefaultServer.InterfaceName}}" required>
        </div>
        <div class="form-group">
            <label for="comment">Comment</label>
            <input type="text" class="form-control" id="comment" name="comment" value="{{.DefaultServer.Comment}}">
        </div>
        <div class="form-group">
            <label for="address">Address CIDR{{template "tooltip" "The server's VPN IP address and subnet in CIDR notation (e.g. 10.0.0.1/24). Defines the VPN network range."}}</label>
            <input type="text" class="form-control" id="address" name="address" value="{{.DefaultServer.Address}}"
                required>
        </div>
        <div class="form-group">
            <label for="port">Port{{template "tooltip" "UDP port WireGuard will listen on (e.g. 51820). Must be open and forwarded on your router."}}</label>
            <input type="number" class="form-control" id="port" name="port" value="{{.DefaultServer.Port}}" required>
        </div>
        <div class="form-group">
            <label for="publicKey">Public Key{{template "tooltip" "Server's WireGuard public key. Auto-generated if left empty."}}</label>
            <input type="text" class="form-control" id="publicKey" name="publicKey" value="{{.DefaultServer.PublicKey}}"
                disabled required>
        </div>
        <div class="form-group">
            <label for="privateKey">Private Key{{template "tooltip" "Server's WireGuard private key. Auto-generated if left empty. Keep this secret."}}</label>
            <input type="text" class="form-control" id="privateKey" name="privateKey"
                value="{{.DefaultServer.PrivateKey}}" disabled required>
        </div>
        <div class="form-group">
            <label for="postUp">Post Up{{template "tooltip-with-cheatsheet" (mkCheat "Shell commands to run after the WireGuard interface comes up. Commonly used for iptables NAT/forwarding rules." "server-postup" "Server PostUp / PostDown")}}</label>
            <textarea class="form-control" id="postUp" name="postUp" rows="3">{{.DefaultServer.PostUp}}</textarea>
        </div>
        <div class="form-group">
            <label for="postDown">Post Down{{template "tooltip-with-cheatsheet" (mkCheat "Shell commands to run after the WireGuard interface goes down. Usually reverses the Post Up rules." "server-postup" "Server PostUp / PostDown")}}</label>
            <textarea class="form-control" id="postDown" name="postDown" rows="3">{{.DefaultServer.PostDown}}</textarea>
        </div>
        <div>&nbsp;</div>

        <h5>Default Client Configurations</h5>
        <hr>
        <div class="form-group">
            <label for="wanAddress">WAN Address{{template "tooltip" "Your public IP or domain name that clients will use to connect to this server."}}</label>
            <input type="text" class="form-control" id="wanAddress" name="wanAddress"
                value="{{.DefaultServer.WANAddress}}" required>
        </div>
        <div class="form-group">
            <label for="supernetCidr">Default Client Supernet CIDR{{template "tooltip-with-cheatsheet" (mkCheat "A broader CIDR range for client Allowed IPs, enabling routing across multiple VPN subnets. Leave empty to use the server's subnet." "supernet" "Default Client Supernet CIDR")}}</label>
            <input type="text" class="form-control" id="supernetCidr" name="supernetCidr"
                value="{{.DefaultServer.SupernetCidr}}">
        </div>
        <div class="form-group">
            <label for="bridgeNetworks">Bridge Networks{{template "tooltip-with-cheatsheet" (mkCheat "Server-side LANs that clients may bridge into through this VPN. Comma-separated CIDRs (e.g. 192.168.50.0/24, 10.10.0.0/16). Each entry becomes a checkbox on the client form." "bridge-networks" "Bridge Networks")}}</label>
            <input type="text" class="form-control" id="bridgeNetworks" name="bridgeNetworks"
                value="{{if .DefaultServer.BridgeNetworks}}{{.DefaultServer.BridgeNetworks}}{{end}}" placeholder="192.168.50.0/24, 10.10.0.0/16">
        </div>
        <div class="form-group">
            <label for="defaultKeepAlive">Default Client Keep Alive{{template "tooltip" "Default persistent keepalive interval (0-600 seconds) for new clients. Helps maintain connections behind NAT."}}</label>
            <input type="number" class="form-control" id="defaultKeepAlive" name="defaultKeepAlive"
                value="{{.DefaultServer.DefaultKeepalive}}">
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save</button>
        <span class="wide-span"></span>
        <a href="#" id="cancel" class="text-secondary">Cancel</a>
    </form>
</div>
{{end}}
